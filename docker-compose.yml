# Server (staging/production) uchun. Lokal ishlab chiqishda ishlatilmaydi.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kaft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: deps }
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/kaft
    volumes: [".:/app", "/app/node_modules"]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/kaft
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/kaft
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
